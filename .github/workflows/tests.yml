
name: Testes do projeto

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
    tags:
      - "v1.0"
  pull_request:
    branches:
      - main
      - master

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verificar erros criticos de codigo
        run: python -m ruff check --select E9,F63,F7,F82 src eval tests tools

      - name: Verificar links locais da documentacao
        run: python -B tools/verificar_documentacao.py

      - name: Configurar Node para testes da interface
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testar apresentacao das metricas no navegador
        run: node --test tests/test_relatorio.mjs

      - name: Executar testes
        run: python -m pytest -v
